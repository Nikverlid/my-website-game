<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>War of the Virtuosos</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-container {
            max-width: 500px;
            width: 100%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(6px);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            text-align: center;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }
        .status-card {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .stat-row:last-child {
            border-bottom: none;
        }
        .stat-label {
            color: #aaa;
        }
        .stat-value {
            font-weight: 600;
            color: #fff;
        }
        .hp-bar {
            margin: 10px 0 6px;
            height: 12px;
            background: #333;
            border-radius: 20px;
            overflow: hidden;
        }
        .hp-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #e74c3c, #f39c12);
            border-radius: 20px;
            transition: width 0.3s;
        }
        .xp-bar {
            margin: 6px 0 0;
            height: 8px;
            background: #333;
            border-radius: 20px;
            overflow: hidden;
        }
        .xp-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3498db, #9b59b6);
            border-radius: 20px;
            transition: width 0.3s;
        }
        .log-area {
            background: rgba(0,0,0,0.4);
            border-radius: 16px;
            padding: 12px;
            min-height: 70px;
            margin-bottom: 16px;
            font-size: 14px;
            line-height: 1.5;
            color: #ccc;
            max-height: 120px;
            overflow-y: auto;
        }
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .btn {
            padding: 14px 0;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255,255,255,0.08);
            color: #fff;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-attack {
            background: #e74c3c;
        }
        .btn-attack:active {
            background: #c0392b;
        }
        .btn-heal {
            background: #2ecc71;
        }
        .btn-heal:active {
            background: #27ae60;
        }
        .btn-status {
            background: #3498db;
        }
        .btn-status:active {
            background: #2980b9;
        }
        .btn-flee {
            background: #95a5a6;
        }
        .btn-flee:active {
            background: #7f8c8d;
        }
        .btn-reset {
            background: #e67e22;
            margin-top: 10px;
            grid-column: span 2;
        }
        .btn-reset:active {
            background: #d35400;
        }
        .enemy-name {
            color: #f1c40f;
            font-weight: 700;
        }
        .log-entry {
            margin-bottom: 4px;
        }
        .log-entry.damage {
            color: #e74c3c;
        }
        .log-entry.heal {
            color: #2ecc71;
        }
        .log-entry.info {
            color: #85c1e9;
        }
        .log-entry.loot {
            color: #f1c40f;
        }
        @media (max-width: 420px) {
            .game-container { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>⚔️ War of Virtuosos</h1>

        <div class="status-card">
            <div class="stat-row">
                <span class="stat-label">👤 Игрок</span>
                <span class="stat-value" id="playerName">Герой</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">🏅 Уровень</span>
                <span class="stat-value" id="playerLevel">1</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">⚔️ Атака</span>
                <span class="stat-value" id="playerAttack">5</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">🛡️ Защита</span>
                <span class="stat-value" id="playerDefense">2</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">❤️ Здоровье</span>
                <span class="stat-value" id="playerHpText">20/20</span>
            </div>
            <div class="hp-bar">
                <div class="hp-fill" id="playerHpFill" style="width:100%"></div>
            </div>
            <div class="stat-row">
                <span class="stat-label">⭐ Опыт</span>
                <span class="stat-value" id="playerXpText">0 / 10</span>
            </div>
            <div class="xp-bar">
                <div class="xp-fill" id="playerXpFill" style="width:0%"></div>
            </div>
        </div>

        <div class="log-area" id="logArea">
            <div class="log-entry info">Добро пожаловать в RPG!</div>
            <div class="log-entry info">Нажми «Сражаться» чтобы найти врага.</div>
        </div>

        <div class="button-grid">
            <button class="btn btn-attack" id="btnFight">⚔️ Сражаться</button>
            <button class="btn btn-heal" id="btnHeal">💚 Лечиться</button>
            <button class="btn btn-status" id="btnStatus">📊 Статус</button>
            <button class="btn btn-flee" id="btnFlee">🏃 Сбежать</button>
            <button class="btn btn-reset" id="btnReset">🔄 Новая игра</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        // ---- Функция опыта ----
        function getXpToNext(level) {
            if (level >= 100) return Infinity;
            if (level === 98) return 999999;
            if (level === 99) return 1000000;
            return Math.floor(10 * Math.pow(1.5, level - 1)) + 5;
        }

        // ---- Игровое состояние ----
        let player = {
            name: "Герой",
            level: 1,
            hp: 20,
            maxHp: 20,
            attack: 5,
            defense: 2,
            xp: 0,
            xpToNext: getXpToNext(1)
        };

        let enemy = null;

        // ---- Сохранение / загрузка ----
        function saveGame() {
            try {
                localStorage.setItem('rpg_save', JSON.stringify(player));
            } catch(e) {}
        }

        function loadGame() {
            try {
                const data = localStorage.getItem('rpg_save');
                if (data) {
                    const parsed = JSON.parse(data);
                    player = parsed;
                    if (!player.maxHp) player.maxHp = player.hp;
                    if (!player.xpToNext) player.xpToNext = getXpToNext(player.level);
                    if (player.level >= 100) player.xpToNext = Infinity;
                }
            } catch(e) {}
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                player.name = tg.initDataUnsafe.user.first_name || player.name;
            }
        }

        function updateUI() {
            document.getElementById('playerName').textContent = player.name;
            document.getElementById('playerLevel').textContent = player.level;
            document.getElementById('playerAttack').textContent = player.attack;
            document.getElementById('playerDefense').textContent = player.defense;
            document.getElementById('playerHpText').textContent = `${player.hp}/${player.maxHp}`;
            const hpPercent = Math.max(0, (player.hp / player.maxHp) * 100);
            document.getElementById('playerHpFill').style.width = hpPercent + '%';
            const xpText = player.xpToNext === Infinity ? '∞' : player.xpToNext;
            document.getElementById('playerXpText').textContent = `${player.xp} / ${xpText}`;
            const xpPercent = player.xpToNext === Infinity ? 100 : Math.min(100, (player.xp / player.xpToNext) * 100);
            document.getElementById('playerXpFill').style.width = xpPercent + '%';
            saveGame();
        }

        function addLog(message, type = 'info') {
            const logArea = document.getElementById('logArea');
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            div.textContent = message;
            logArea.appendChild(div);
            logArea.scrollTop = logArea.scrollHeight;
            if (logArea.children.length > 50) {
                logArea.removeChild(logArea.children[0]);
            }
        }

        function generateEnemy() {
            const levelScale = player.level;
            const names = ['Гоблин', 'Скелет', 'Волк', 'Бандит', 'Тролль', 'Призрак', 'Орк'];
            const name = names[Math.floor(Math.random() * names.length)];
            const hp = Math.floor(10 + levelScale * 4 + Math.random() * 8);
            const attack = Math.floor(3 + levelScale * 2 + Math.random() * 3);
            const defense = Math.floor(1 + levelScale * 1 + Math.random() * 2);
            const xpReward = Math.floor(5 + levelScale * 3 + Math.random() * 4);
            return { name, hp, maxHp: hp, attack, defense, xpReward };
        }

        // ---- Боевые действия ----
        function fight() {
            if (!enemy) {
                enemy = generateEnemy();
                addLog(`⚔️ Вы встретили ${enemy.name} (HP: ${enemy.hp})`, 'info');
                updateUI();
                return;
            }

            // Игрок атакует
            const playerDamage = Math.max(1, player.attack - Math.floor(enemy.defense * 0.5) + Math.floor(Math.random() * 3));
            enemy.hp -= playerDamage;
            addLog(`🗡️ Вы нанесли ${playerDamage} урона ${enemy.name}`, 'damage');

            if (enemy.hp <= 0) {
                // Победа!
                if (player.level < 100) {
                    const xpGain = enemy.xpReward;
                    player.xp += xpGain;
                    addLog(`💀 ${enemy.name} повержен! +${xpGain} опыта`, 'loot');
                    while (player.level < 100 && player.xp >= player.xpToNext) {
                        player.xp -= player.xpToNext;
                        player.level++;
                        player.maxHp += 5;
                        player.hp = Math.min(player.hp + 5, player.maxHp);
                        player.attack += 2;
                        player.defense += 1;
                        player.xpToNext = getXpToNext(player.level);
                        addLog(`🎉 УРОВЕНЬ ${player.level}! Характеристики улучшены!`, 'loot');
                    }
                    if (player.level === 100) {
                        addLog('🏆 Вы достигли максимального уровня!', 'loot');
                        player.xpToNext = Infinity;
                        if (player.xp > 0) player.xp = 0;
                    }
                } else {
                    addLog(`💀 ${enemy.name} повержен! Вы достигли максимального уровня!`, 'loot');
                }
                enemy = null;
                updateUI();
                try {
                    tg.sendData(JSON.stringify({ action: 'victory', level: player.level }));
                } catch(e) {}
                return;
            }

            // Враг атакует
            const enemyDamage = Math.max(1, enemy.attack - Math.floor(player.defense * 0.5) + Math.floor(Math.random() * 2));
            player.hp -= enemyDamage;
            addLog(`💢 ${enemy.name} наносит ${enemyDamage} урона`, 'damage');

            if (player.hp <= 0) {
                player.hp = 0;
                addLog(`💀 Вы погибли в бою... Нажмите «Новая игра»`, 'damage');
                enemy = null;
                updateUI();
                return;
            }

            updateUI();
            try {
                tg.sendData(JSON.stringify({ action: 'fight', hp: player.hp }));
            } catch(e) {}
        }

        function heal() {
            if (player.hp <= 0) {
                addLog('Вы не можете лечиться, вы мертвы!', 'damage');
                return;
            }
            const healAmount = Math.floor(5 + player.level * 2 + Math.random() * 5);
            player.hp = Math.min(player.maxHp, player.hp + healAmount);
            addLog(`💚 Вы восстановили ${healAmount} HP`, 'heal');
            updateUI();
        }

        function flee() {
            if (!enemy) {
                addLog('Нет врага, чтобы сбежать.', 'info');
                return;
            }
            if (Math.random() < 0.5) {
                addLog(`🏃 Вы сбежали от ${enemy.name}!`, 'info');
                enemy = null;
            } else {
                addLog(`😰 Не удалось сбежать! ${enemy.name} атакует!`, 'damage');
                const enemyDamage = Math.max(1, enemy.attack - Math.floor(player.defense * 0.5) + Math.floor(Math.random() * 2));
                player.hp -= enemyDamage;
                addLog(`💢 ${enemy.name} наносит ${enemyDamage} урона`, 'damage');
                if (player.hp <= 0) {
                    player.hp = 0;
                    addLog(`💀 Вы погибли...`, 'damage');
                    enemy = null;
                }
                updateUI();
            }
            updateUI();
        }

        function showStatus() {
            if (enemy) {
                addLog(`👾 Враг: ${enemy.name} | HP: ${enemy.hp}/${enemy.maxHp}`, 'info');
            } else {
                let msg = `👤 Игрок: ${player.name} | Ур.${player.level}`;
                if (player.level >= 100) msg += ' (МАКСИМУМ)';
                const xpDisplay = player.xpToNext === Infinity ? '∞' : player.xpToNext;
                msg += ` | HP: ${player.hp}/${player.maxHp} | Опыт: ${player.xp}/${xpDisplay}`;
                addLog(msg, 'info');
            }
        }

        function resetGame() {
            if (confirm('Начать новую игру? Прогресс будет потерян.')) {
                player = {
                    name: player.name,
                    level: 1,
                    hp: 20,
                    maxHp: 20,
                    attack: 5,
                    defense: 2,
                    xp: 0,
                    xpToNext: getXpToNext(1)
                };
                enemy = null;
                addLog('🔄 Игра перезапущена!', 'info');
                updateUI();
                localStorage.removeItem('rpg_save');
                try {
                    tg.sendData(JSON.stringify({ action: 'reset' }));
                } catch(e) {}
            }
        }

        // ---- Инициализация ----
        loadGame();
        updateUI();
        addLog(`👋 Привет, ${player.name}! Добро пожаловать в игру.`, 'info');

        // ---- Обработчики ----
        document.getElementById('btnFight').addEventListener('click', fight);
        document.getElementById('btnHeal').addEventListener('click', heal);
        document.getElementById('btnFlee').addEventListener('click', flee);
        document.getElementById('btnStatus').addEventListener('click', showStatus);
        document.getElementById('btnReset').addEventListener('click', resetGame);

        window.addEventListener('beforeunload', () => saveGame());

        console.log('RPG загружена!');
    </script>
</body>
</html>

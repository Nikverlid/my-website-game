<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>War of the Virtuosos</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(145deg, #0b0b1a, #1a1a2e);
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* ----- Основной контейнер ----- */
        .game-container {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
            border-radius: 36px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
        }

        /* ----- Заголовок ----- */
        h1 {
            text-align: center;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        /* ----- Статус (краткий) ----- */
        .top-status {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 10px 14px;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .top-status span {
            color: #aaa;
        }
        .top-status .value {
            color: #fff;
            font-weight: 600;
        }

        /* ----- Боевой лог ----- */
        .log-area {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 10px 14px;
            min-height: 70px;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.5;
            color: #ccc;
            max-height: 110px;
            overflow-y: auto;
        }
        .log-entry {
            margin-bottom: 3px;
        }
        .log-entry.damage {
            color: #e74c3c;
        }
        .log-entry.heal {
            color: #2ecc71;
        }
        .log-entry.info {
            color: #85c1e9;
        }
        .log-entry.loot {
            color: #f1c40f;
        }

        /* ----- Кнопки действий ----- */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .btn {
            padding: 12px 0;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-attack {
            background: #e74c3c;
        }
        .btn-attack:active {
            background: #c0392b;
        }
        .btn-heal {
            background: #2ecc71;
        }
        .btn-heal:active {
            background: #27ae60;
        }
        .btn-flee {
            background: #95a5a6;
        }
        .btn-flee:active {
            background: #7f8c8d;
        }
        .btn-char {
            background: #8e44ad;
            grid-column: span 2;
        }
        .btn-char:active {
            background: #6c3483;
        }
        .btn-reset {
            background: #e67e22;
            grid-column: span 2;
        }
        .btn-reset:active {
            background: #d35400;
        }

        /* ===== МОДАЛЬНОЕ ОКНО ПЕРСОНАЖА ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: linear-gradient(145deg, #1e1e32, #12121f);
            border-radius: 36px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            position: relative;
        }
        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        .modal-close:hover {
            background: #e74c3c;
        }

        /* ---- Сетка окна персонажа ---- */
        .char-grid {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 16px;
            align-items: start;
            margin-top: 8px;
        }

        /* Левая панель: статистика */
        .stat-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 12px;
        }
        .stat-panel .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        .stat-panel .tab-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #aaa;
            padding: 6px 0;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .stat-panel .tab-btn.active {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .stat-content {
            font-size: 14px;
            line-height: 1.8;
        }
        .stat-content .row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 4px 0;
        }
        .stat-content .row .label {
            color: #aaa;
        }
        .stat-content .row .val {
            color: #fff;
            font-weight: 600;
        }

        /* Центральная панель: фигура + уровень */
        .center-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .frame-container {
            position: relative;
            width: 100%;
            max-width: 200px;
            aspect-ratio: 1/1;
            margin-bottom: 8px;
        }
        .frame-container svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .frame-border {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .level-badge {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            white-space: nowrap;
            border: 2px solid #f1c40f;
        }

        /* Правая панель: книжная закладка */
        .bookmark-panel {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .bookmark-btn {
            background: #8e44ad;
            border: none;
            border-radius: 30px 0 0 30px;
            padding: 12px 18px;
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: -4px 4px 12px rgba(0, 0, 0, 0.4);
            writing-mode: vertical-rl;
            letter-spacing: 4px;
            border-right: 3px solid #f1c40f;
        }
        .bookmark-btn:hover {
            background: #6c3483;
            padding-right: 24px;
        }

        /* Окно характеристик (звезда) */
        .stars-window {
            display: none;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 24px;
            padding: 16px;
            margin-top: 12px;
            width: 100%;
            border: 1px solid rgba(255, 215, 0, 0.2);
            animation: fadeSlide 0.3s ease;
        }
        .stars-window.open {
            display: block;
        }
        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hexagram {
            position: relative;
            width: 100%;
            max-width: 260px;
            margin: 0 auto;
            aspect-ratio: 1/1;
        }
        .hexagram svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .stat-node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 13px;
            transform: translate(-50%, -50%);
            min-width: 70px;
            text-align: center;
            backdrop-filter: blur(4px);
        }
        .stat-node .stat-label {
            font-weight: 600;
            color: #f1c40f;
        }
        .stat-node .stat-val {
            color: #fff;
            font-weight: 700;
            font-size: 16px;
        }
        .stat-node .stat-plus {
            background: #2ecc71;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stat-node .stat-plus:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.4;
        }
        .stat-node .stat-plus:active {
            transform: scale(0.9);
        }
        .stat-points-display {
            color: #f1c40f;
            font-weight: 700;
            font-size: 14px;
            margin-top: 8px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .char-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .bookmark-panel {
                align-items: stretch;
            }
            .bookmark-btn {
                writing-mode: horizontal-tb;
                border-radius: 30px;
                padding: 10px;
                text-align: center;
                border-right: none;
                border-bottom: 3px solid #f1c40f;
            }
            .stat-node {
                font-size: 11px;
                padding: 4px 8px;
                min-width: 60px;
            }
            .stat-node .stat-val {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ОСНОВНОЙ ИГРОВОЙ ЭКРАН ===== -->
    <div class="game-container" id="gameContainer">
        <h1>⚔️ War of Virtuosos</h1>

        <div class="top-status">
            <span>👤 <span class="value" id="playerNameTop">Герой</span></span>
            <span>🏅 <span class="value" id="playerLevelTop">1</span></span>
            <span>❤️ <span class="value" id="playerHpTop">20/20</span></span>
        </div>

        <div class="log-area" id="logArea">
            <div class="log-entry info">Добро пожаловать в RPG!</div>
            <div class="log-entry info">Используйте кнопки внизу.</div>
        </div>

        <div class="button-grid">
            <button class="btn btn-attack" id="btnFight">⚔️ Сражаться</button>
            <button class="btn btn-heal" id="btnHeal">💚 Лечиться</button>
            <button class="btn btn-flee" id="btnFlee">🏃 Сбежать</button>
            <button class="btn btn-char" id="btnOpenChar">👤 Персонаж</button>
            <button class="btn btn-reset" id="btnReset">🔄 Новая игра</button>
        </div>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО ПЕРСОНАЖА ===== -->
    <div class="modal-overlay" id="charModal">
        <div class="modal">
            <button class="modal-close" id="closeCharModal">✕</button>

            <div class="char-grid">
                <!-- ЛЕВАЯ ПАНЕЛЬ: Статистика -->
                <div class="stat-panel">
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="magic">🧙 Магия</button>
                        <button class="tab-btn" data-tab="physical">⚔️ Физика</button>
                    </div>
                    <div class="stat-content" id="statContent">
                        <!-- заполняется JS -->
                    </div>
                </div>

                <!-- ЦЕНТР: Фигура + уровень -->
                <div class="center-panel">
                    <div class="frame-container" id="frameContainer">
                        <svg viewBox="0 0 200 200">
                            <!-- Оправа (будет меняться через JS) -->
                            <circle cx="100" cy="100" r="80" class="frame-border" id="frameCircle" stroke="#cd7f32" />
                            <!-- Витрувианский человек (упрощённо) -->
                            <circle cx="100" cy="100" r="30" fill="none" stroke="#fff" stroke-width="2" opacity="0.4" />
                            <circle cx="100" cy="100" r="20" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.3" />
                            <!-- Голова -->
                            <circle cx="100" cy="70" r="12" fill="#d4a373" stroke="#fff" stroke-width="1.5" />
                            <!-- Тело (линии) -->
                            <line x1="100" y1="82" x2="100" y2="130" stroke="#d4a373" stroke-width="3" />
                            <!-- Руки (4 руки - многорукий) -->
                            <line x1="100" y1="95" x2="65" y2="70" stroke="#d4a373" stroke-width="2.5" />
                            <line x1="100" y1="95" x2="135" y2="70" stroke="#d4a373" stroke-width="2.5" />
                            <line x1="100" y1="105" x2="55" y2="95" stroke="#d4a373" stroke-width="2.5" />
                            <line x1="100" y1="105" x2="145" y2="95" stroke="#d4a373" stroke-width="2.5" />
                            <!-- Ноги -->
                            <line x1="100" y1="130" x2="75" y2="165" stroke="#d4a373" stroke-width="3" />
                            <line x1="100" y1="130" x2="125" y2="165" stroke="#d4a373" stroke-width="3" />
                            <!-- Круги на руках/ногах (символы) -->
                            <circle cx="65" cy="70" r="4" fill="#f1c40f" />
                            <circle cx="135" cy="70" r="4" fill="#f1c40f" />
                            <circle cx="55" cy="95" r="4" fill="#f1c40f" />
                            <circle cx="145" cy="95" r="4" fill="#f1c40f" />
                            <circle cx="75" cy="165" r="4" fill="#f1c40f" />
                            <circle cx="125" cy="165" r="4" fill="#f1c40f" />
                        </svg>
                        <div class="level-badge" id="levelBadge">Ур. 1</div>
                    </div>
                </div>

                <!-- ПРАВАЯ ПАНЕЛЬ: Книжная закладка -->
                <div class="bookmark-panel">
                    <button class="bookmark-btn" id="bookmarkToggle">📜 Характеристики</button>
                    <div class="stars-window" id="starsWindow">
                        <div class="hexagram" id="hexagramContainer">
                            <!-- SVG звезды и узлы характеристик будут вставлены JS -->
                        </div>
                        <div class="stat-points-display">Очки: <span id="statPointsModal">0</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // =====================================================================
        //  ИНИЦИАЛИЗАЦИЯ TELEGRAM
        // =====================================================================
        const tg = window.Telegram.WebApp;
        tg.ready();

        // =====================================================================
        //  ИГРОВОЕ СОСТОЯНИЕ (полное)
        // =====================================================================
        let player = {
            name: "Герой",
            level: 1,
            xp: 0,
            xpToNext: getXpToNext(1),
            hp: 20,
            maxHp: 20,
            attack: 5,
            defense: 2,
            critChance: 5,
            critMult: 150,
            dodge: 5,
            // Характеристики (6 штук)
            intelligence: 1,
            wisdom: 1,
            strength: 1,
            agility: 1,
            constitution: 1,
            luck: 1,
            statPoints: 0
        };
        let enemy = null;

        // =====================================================================
        //  ФУНКЦИИ РАСЧЁТА
        // =====================================================================
        function getXpToNext(level) {
            if (level >= 100) return Infinity;
            if (level === 98) return 999999;
            if (level === 99) return 1000000;
            return Math.floor(10 * Math.pow(1.5, level - 1)) + 5;
        }

        // Бонусы Интеллекта (маг. урон, шанс крита маг)
        function getIntellectBonuses(intel) {
            let magicAttackBonus = 0;
            let magicCritChanceBonus = 0;
            for (let i = 1; i <= intel; i++) {
                if (i % 5 !== 0) magicAttackBonus += 1;
            }
            const excluded5 = [20, 40, 50, 60, 80, 100];
            for (let i = 5; i <= intel; i += 5) {
                if (!excluded5.includes(i)) {
                    magicAttackBonus += 2;
                    magicCritChanceBonus += 2;
                }
            }
            for (let i = 20; i <= intel; i += 20) {
                if (i !== 100) {
                    magicAttackBonus += 5;
                    magicCritChanceBonus += 5;
                }
            }
            for (let i = 50; i <= intel; i += 50) {
                if (i !== 100) magicAttackBonus += 30;
            }
            if (intel >= 100) {
                magicAttackBonus += 50;
                magicCritChanceBonus += 10;
            }
            return { magicAttackBonus, magicCritChanceBonus };
        }

        // Бонусы Мудрости (крит множитель маг, уклонение от маг)
        function getWisdomBonuses(wisdom) {
            let magicCritMultBonus = 0;
            let magicDodgeBonus = 0;
            for (let i = 1; i <= wisdom; i++) {
                if (i % 5 !== 0) magicCritMultBonus += 2;
            }
            const excluded5 = [20, 40, 50, 60, 80, 100];
            for (let i = 5; i <= wisdom; i += 5) {
                if (!excluded5.includes(i)) {
                    magicCritMultBonus += 2;
                    magicDodgeBonus += 2;
                }
            }
            for (let i = 20; i <= wisdom; i += 20) {
                if (i !== 100) {
                    magicCritMultBonus += 5;
                    magicDodgeBonus += 5;
                }
            }
            for (let i = 50; i <= wisdom; i += 50) {
                if (i !== 100) {
                    magicCritMultBonus += 15;
                    magicDodgeBonus += 15;
                }
            }
            if (wisdom >= 100) {
                magicCritMultBonus += 50;
                magicDodgeBonus += 20;
            }
            return { magicCritMultBonus, magicDodgeBonus };
        }

        // Физические параметры от Силы, Ловкости, Телосложения, Удачи
        function getPhysicalBonuses(strength, agility, constitution, luck) {
            const physAttack = 5 + Math.floor(strength * 0.5);
            const physCritChance = 5 + agility * 0.3 + luck * 0.2;
            const physCritMult = 150 + luck * 1;
            const maxHp = 20 + constitution * 3;
            const physDefense = 2 + Math.floor(constitution * 0.5);
            const physDodge = 5 + agility * 0.5;
            return {
                physAttack,
                physCritChance: Math.min(physCritChance, 100),
                physCritMult: Math.min(physCritMult, 300),
                maxHp,
                physDefense,
                physDodge: Math.min(physDodge, 80)
            };
        }

        // Пересчёт всех боевых параметров
        function recalcStats() {
            const intel = getIntellectBonuses(player.intelligence);
            const wis = getWisdomBonuses(player.wisdom);
            // Сохраняем магические бонусы (пока не используем в бою, но для статистики)
            player.magicAttackBonus = intel.magicAttackBonus;
            player.magicCritChanceBonus = intel.magicCritChanceBonus;
            player.magicCritMultBonus = wis.magicCritMultBonus;
            player.magicDodgeBonus = wis.magicDodgeBonus;

            const phys = getPhysicalBonuses(player.strength, player.agility, player.constitution, player.luck);
            player.attack = phys.physAttack;
            player.defense = phys.physDefense;
            player.maxHp = phys.maxHp;
            player.critChance = phys.physCritChance;
            player.critMult = phys.physCritMult;
            player.dodge = phys.physDodge;

            if (player.hp > player.maxHp) player.hp = player.maxHp;
            player.xpToNext = getXpToNext(player.level);
        }

        // =====================================================================
        //  СОХРАНЕНИЕ / ЗАГРУЗКА
        // =====================================================================
        function saveGame() {
            try {
                localStorage.setItem('rpg_save', JSON.stringify(player));
            } catch (e) {}
        }

        function loadGame() {
            try {
                const data = localStorage.getItem('rpg_save');
                if (data) {
                    const parsed = JSON.parse(data);
                    player = parsed;
                    // Инициализация недостающих полей
                    const defaults = {
                        intelligence: 1,
                        wisdom: 1,
                        strength: 1,
                        agility: 1,
                        constitution: 1,
                        luck: 1,
                        statPoints: 0
                    };
                    for (let key in defaults) {
                        if (player[key] === undefined) player[key] = defaults[key];
                    }
                    recalcStats();
                }
            } catch (e) {}
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                player.name = tg.initDataUnsafe.user.first_name || player.name;
            }
        }

        // =====================================================================
        //  UI ОБНОВЛЕНИЕ (основной экран)
        // =====================================================================
        function updateMainUI() {
            document.getElementById('playerNameTop').textContent = player.name;
            document.getElementById('playerLevelTop').textContent = player.level;
            document.getElementById('playerHpTop').textContent = `${player.hp}/${player.maxHp}`;
        }

        function addLog(message, type = 'info') {
            const logArea = document.getElementById('logArea');
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            div.textContent = message;
            logArea.appendChild(div);
            logArea.scrollTop = logArea.scrollHeight;
            if (logArea.children.length > 50) {
                logArea.removeChild(logArea.children[0]);
            }
        }

        // =====================================================================
        //  ОКНО ПЕРСОНАЖА – ОБНОВЛЕНИЕ
        // =====================================================================
        function updateCharWindow() {
            // 1. Оправа уровня
            const level = player.level;
            let frameColor, frameLabel;
            const tier = Math.min(Math.floor(level / 20), 5); // 0..5
            const colors = ['#cd7f32', '#b87333', '#a0a0a0', '#ffd700', '#b9f2ff', '#2f1b3d'];
            const labels = ['Деревянная', 'Бронзовая', 'Железная', 'Золотая', 'Алмазная', 'Обсидиановая'];
            frameColor = colors[tier] || colors[0];
            frameLabel = labels[tier] || labels[0];
            document.getElementById('frameCircle').setAttribute('stroke', frameColor);
            document.getElementById('levelBadge').textContent = `Ур. ${level} (${frameLabel})`;

            // 2. Левая панель – статистика
            updateStatPanel();

            // 3. Правая панель – звезда характеристик
            updateStarsWindow();

            // 4. Обновить очки
            document.getElementById('statPointsModal').textContent = player.statPoints;
        }

        // ---- Левая панель (статистика) ----
        let currentStatTab = 'magic';

        function updateStatPanel() {
            const container = document.getElementById('statContent');
            if (currentStatTab === 'magic') {
                // Магическая статистика (бонусы от характеристик + снаряжения)
                const intel = getIntellectBonuses(player.intelligence);
                const wis = getWisdomBonuses(player.wisdom);
                // Снаряжение пока 0, но добавим задел
                const gearMagicAtk = 0,
                    gearMagicCrit = 0,
                    gearMagicDodge = 0;
                const totalMagicAtk = intel.magicAttackBonus + gearMagicAtk;
                const totalMagicCrit = intel.magicCritChanceBonus + gearMagicCrit;
                const totalMagicDodge = wis.magicDodgeBonus + gearMagicDodge;
                container.innerHTML = `
                    <div class="row"><span class="label">🧙 Маг. урон</span><span class="val">${totalMagicAtk}%</span></div>
                    <div class="row"><span class="label">💥 Шанс крита (маг)</span><span class="val">${totalMagicCrit}%</span></div>
                    <div class="row"><span class="label">🌀 Уклонение (маг)</span><span class="val">${totalMagicDodge}%</span></div>
                    <div class="row" style="border-top:1px solid rgba(255,255,255,0.1); margin-top:6px; padding-top:6px;">
                        <span class="label">📈 Интеллект</span><span class="val">${player.intelligence}</span>
                    </div>
                    <div class="row"><span class="label">📈 Мудрость</span><span class="val">${player.wisdom}</span></div>
                `;
            } else {
                // Физическая статистика (боевые параметры)
                container.innerHTML = `
                    <div class="row"><span class="label">⚔️ Атака</span><span class="val">${player.attack}</span></div>
                    <div class="row"><span class="label">🛡️ Защита</span><span class="val">${player.defense}</span></div>
                    <div class="row"><span class="label">💥 Крит шанс</span><span class="val">${Math.round(player.critChance)}%</span></div>
                    <div class="row"><span class="label">💢 Крит множитель</span><span class="val">${Math.round(player.critMult)}%</span></div>
                    <div class="row"><span class="label">🌀 Уклонение</span><span class="val">${Math.round(player.dodge)}%</span></div>
                    <div class="row" style="border-top:1px solid rgba(255,255,255,0.1); margin-top:6px; padding-top:6px;">
                        <span class="label">💪 Сила</span><span class="val">${player.strength}</span>
                    </div>
                    <div class="row"><span class="label">🏃 Ловкость</span><span class="val">${player.agility}</span></div>
                    <div class="row"><span class="label">🛡️ Телосложение</span><span class="val">${player.constitution}</span></div>
                    <div class="row"><span class="label">🍀 Удача</span><span class="val">${player.luck}</span></div>
                `;
            }
        }

        // ---- Правая панель (звезда) ----
        function updateStarsWindow() {
            const container = document.getElementById('hexagramContainer');
            // Шестиконечная звезда (гексаграмма) в круге
            // Углы: 6 лучей. Расположим характеристики по часовой стрелке: Интеллект, Мудрость, Сила, Ловкость, Телосложение, Удача
            const stats = [
                { key: 'intelligence', label: 'Интеллект', color: '#8e44ad' },
                { key: 'wisdom', label: 'Мудрость', color: '#2980b9' },
                { key: 'strength', label: 'Сила', color: '#e74c3c' },
                { key: 'agility', label: 'Ловкость', color: '#2ecc71' },
                { key: 'constitution', label: 'Телосложение', color: '#f39c12' },
                { key: 'luck', label: 'Удача', color: '#1abc9c' }
            ];
            // Позиции лучей (углы в градусах, центр 50% 50%, радиус 70%)
            const angles = [0, 60, 120, 180, 240, 300]; // градусы
            const cx = 50,
                cy = 50,
                r = 38; // проценты
            let svgContent = `
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="#555" stroke-width="1.5" />
                    <!-- Шестиконечная звезда -->
                    <polygon points="50,10 75,38 65,38 90,70 70,70 50,95 30,70 10,70 35,38 25,38" fill="rgba(255,215,0,0.08)" stroke="#f1c40f" stroke-width="1" />
            `;
            // Добавим линии от центра к углам
            stats.forEach((s, i) => {
                const angle = angles[i] * Math.PI / 180;
                const x = cx + r * Math.cos(angle);
                const y = cy + r * Math.sin(angle);
                svgContent += `<line x1="50" y1="50" x2="${x}" y2="${y}" stroke="#555" stroke-width="0.5" />`;
            });
            svgContent += `</svg>`;
            container.innerHTML = svgContent;

            // Теперь вставим узлы с характеристиками поверх SVG (абсолютное позиционирование)
            const nodesContainer = container;
            stats.forEach((s, i) => {
                const angle = angles[i] * Math.PI / 180;
                const rNode = 42; // проценты от ширины контейнера
                const x = 50 + rNode * Math.cos(angle);
                const y = 50 + rNode * Math.sin(angle);
                const val = player[s.key];
                const maxed = val >= 100;
                const canUp = player.statPoints > 0 && !maxed;
                const node = document.createElement('div');
                node.className = 'stat-node';
                node.style.left = x + '%';
                node.style.top = y + '%';
                node.innerHTML = `
                    <span class="stat-label">${s.label}</span>
                    <span class="stat-val">${val}</span>
                    <button class="stat-plus" ${canUp ? '' : 'disabled'} data-stat="${s.key}">+</button>
                `;
                nodesContainer.appendChild(node);
            });

            // Обработчики для кнопок "+"
            document.querySelectorAll('.stat-node .stat-plus').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const statKey = this.dataset.stat;
                    if (player.statPoints > 0 && player[statKey] < 100) {
                        player[statKey]++;
                        player.statPoints--;
                        recalcStats();
                        saveGame();
                        updateCharWindow();
                        updateMainUI();
                        addLog(`⬆ ${statKey} увеличена до ${player[statKey]}`, 'info');
                    }
                });
            });
        }

        // =====================================================================
        //  БОЕВАЯ МЕХАНИКА (без изменений, но используем player)
        // =====================================================================
        function generateEnemy() {
            const levelScale = player.level;
            const names = ['Гоблин', 'Скелет', 'Волк', 'Бандит', 'Тролль', 'Призрак', 'Орк'];
            const name = names[Math.floor(Math.random() * names.length)];
            const hp = Math.floor(10 + levelScale * 4 + Math.random() * 8);
            const attack = Math.floor(3 + levelScale * 2 + Math.random() * 3);
            const defense = Math.floor(1 + levelScale * 1 + Math.random() * 2);
            const xpReward = Math.floor(5 + levelScale * 3 + Math.random() * 4);
            return { name, hp, maxHp: hp, attack, defense, xpReward };
        }

        function fight() {
            if (!enemy) {
                enemy = generateEnemy();
                addLog(`⚔️ Вы встретили ${enemy.name} (HP: ${enemy.hp})`, 'info');
                updateMainUI();
                return;
            }
            // Атака игрока с учётом крита
            let playerDamage = Math.max(1, player.attack - Math.floor(enemy.defense * 0.5) + Math.floor(Math.random() * 3));
            let isCrit = false;
            if (Math.random() * 100 < player.critChance) {
                isCrit = true;
                playerDamage = Math.floor(playerDamage * (player.critMult / 100));
            }
            enemy.hp -= playerDamage;
            let logMsg = `🗡️ Вы нанесли ${playerDamage} урона ${enemy.name}`;
            if (isCrit) logMsg += ' (КРИТ!)';
            addLog(logMsg, 'damage');

            if (enemy.hp <= 0) {
                // Победа
                if (player.level < 100) {
                    const xpGain = enemy.xpReward;
                    player.xp += xpGain;
                    addLog(`💀 ${enemy.name} повержен! +${xpGain} опыта`, 'loot');
                    while (player.level < 100 && player.xp >= player.xpToNext) {
                        player.xp -= player.xpToNext;
                        player.level++;
                        player.statPoints += 2;
                        addLog(`🎉 УРОВЕНЬ ${player.level}! +2 очка характеристик!`, 'loot');
                        player.xpToNext = getXpToNext(player.level);
                    }
                    if (player.level === 100) {
                        addLog('🏆 Максимальный уровень!', 'loot');
                        player.xpToNext = Infinity;
                        if (player.xp > 0) player.xp = 0;
                    }
                } else {
                    addLog(`💀 ${enemy.name} повержен! Вы уже на максимуме.`, 'loot');
                }
                enemy = null;
                recalcStats();
                updateMainUI();
                updateCharWindow();
                try {
                    tg.sendData(JSON.stringify({ action: 'victory', level: player.level }));
                } catch (e) {}
                return;
            }

            // Враг атакует
            let enemyHits = true;
            if (Math.random() * 100 < player.dodge) {
                enemyHits = false;
                addLog(`🌀 Вы уклонились от атаки ${enemy.name}!`, 'info');
            }
            if (enemyHits) {
                let enemyDamage = Math.max(1, enemy.attack - Math.floor(player.defense * 0.5) + Math.floor(Math.random() * 2));
                player.hp -= enemyDamage;
                addLog(`💢 ${enemy.name} наносит ${enemyDamage} урона`, 'damage');
                if (player.hp <= 0) {
                    player.hp = 0;
                    addLog(`💀 Вы погибли...`, 'damage');
                    enemy = null;
                    updateMainUI();
                    updateCharWindow();
                    return;
                }
            }
            recalcStats();
            updateMainUI();
            updateCharWindow();
            try {
                tg.sendData(JSON.stringify({ action: 'fight', hp: player.hp }));
            } catch (e) {}
        }

        function heal() {
            if (player.hp <= 0) {
                addLog('Вы мертвы!', 'damage');
                return;
            }
            const healAmount = Math.floor(5 + player.level * 2 + Math.random() * 5);
            player.hp = Math.min(player.maxHp, player.hp + healAmount);
            addLog(`💚 +${healAmount} HP`, 'heal');
            updateMainUI();
            updateCharWindow();
        }

        function flee() {
            if (!enemy) {
                addLog('Нет врага.', 'info');
                return;
            }
            if (Math.random() < 0.5) {
                addLog(`🏃 Сбежали от ${enemy.name}!`, 'info');
                enemy = null;
            } else {
                addLog(`😰 Не удалось сбежать!`, 'damage');
                let enemyDamage = Math.max(1, enemy.attack - Math.floor(player.defense * 0.5) + Math.floor(Math.random() * 2));
                if (Math.random() * 100 < player.dodge) {
                    addLog(`🌀 Уклонились!`, 'info');
                } else {
                    player.hp -= enemyDamage;
                    addLog(`💢 ${enemy.name} наносит ${enemyDamage} урона`, 'damage');
                    if (player.hp <= 0) {
                        player.hp = 0;
                        addLog(`💀 Вы погибли...`, 'damage');
                        enemy = null;
                    }
                }
                updateMainUI();
                updateCharWindow();
            }
        }

        function resetGame() {
            if (confirm('Начать заново?')) {
                player = {
                    name: player.name,
                    level: 1,
                    xp: 0,
                    xpToNext: getXpToNext(1),
                    hp: 20,
                    maxHp: 20,
                    attack: 5,
                    defense: 2,
                    critChance: 5,
                    critMult: 150,
                    dodge: 5,
                    intelligence: 1,
                    wisdom: 1,
                    strength: 1,
                    agility: 1,
                    constitution: 1,
                    luck: 1,
                    statPoints: 0
                };
                enemy = null;
                recalcStats();
                updateMainUI();
                updateCharWindow();
                localStorage.removeItem('rpg_save');
                addLog('🔄 Игра сброшена', 'info');
                try {
                    tg.sendData(JSON.stringify({ action: 'reset' }));
                } catch (e) {}
            }
        }

        // =====================================================================
        //  МОДАЛЬНОЕ ОКНО – УПРАВЛЕНИЕ
        // =====================================================================
        const modal = document.getElementById('charModal');
        const openBtn = document.getElementById('btnOpenChar');
        const closeBtn = document.getElementById('closeCharModal');

        function openModal() {
            modal.classList.add('active');
            updateCharWindow();
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        openBtn.addEventListener('click', openModal);
        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeModal();
        });

        // Переключение вкладок статистики
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentStatTab = this.dataset.tab;
                updateStatPanel();
            });
        });

        // Книжная закладка (открыть/закрыть звезду)
        const bookmarkBtn = document.getElementById('bookmarkToggle');
        const starsWindow = document.getElementById('starsWindow');
        let starsOpen = false;
        bookmarkBtn.addEventListener('click', function() {
            starsOpen = !starsOpen;
            starsWindow.classList.toggle('open', starsOpen);
            if (starsOpen) {
                updateStarsWindow();
                document.getElementById('statPointsModal').textContent = player.statPoints;
            }
        });

        // =====================================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // =====================================================================
        loadGame();
        recalcStats();
        updateMainUI();
        addLog(`👋 Привет, ${player.name}!`, 'info');

        // Обработчики кнопок боя
        document.getElementById('btnFight').addEventListener('click', fight);
        document.getElementById('btnHeal').addEventListener('click', heal);
        document.getElementById('btnFlee').addEventListener('click', flee);
        document.getElementById('btnReset').addEventListener('click', resetGame);

        // Сохранение при закрытии
        window.addEventListener('beforeunload', () => saveGame());
        console.log('RPG с новым интерфейсом загружена!');
    </script>
</body>
</html>
